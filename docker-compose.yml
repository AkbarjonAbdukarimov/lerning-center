services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ttask}
      POSTGRES_DB: ${POSTGRES_DB:-ttask}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ttask}:${POSTGRES_PASSWORD:-ttask}@db:5432/${POSTGRES_DB:-ttask}?schema=public
      PORT: 3000
      SEED: ${SEED:-true}
      TZ: ${TZ:-Asia/Tashkent}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
